name: Build Application

on:
    workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        strategy:
            matrix:
                os: [windows-latest, macos-15-intel, macos-15]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Download repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.14.5"

            - name: Install dependencies
              run: python -m pip install -r requirements.txt pyinstaller

            - name: Build executable
              run: python -m PyInstaller --onefile --console --name PersonalPurchaseArchive app.py

            - name: Upload executable
              uses: actions/upload-artifact@v6
              with:
                name: PersonalPurchaseArchive-${{ matrix.os }}
                path: dist/*
